name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Core checks + macOS / iOS Simulator builds
        run: ./Scripts/verify.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-output
          path: |
            Scripts/output/*.log
            Scripts/output/*.xlsx
          if-no-files-found: ignore
